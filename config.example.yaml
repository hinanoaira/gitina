# Server Configuration
server:
  listen: ":8080"
  base_url: "https://git.hns.jp"
  repo_root: "./data/repositories" # Local SSD cache directory
  jwt_secret: "replace-with-a-very-long-random-secret-key"

# Repository Storage (Tiered Storage)
# Keep "local" for standalone disk storage, or "s3" to use S3/R2 as master with local SSD LRU cache.
repository_storage:
  type: "local" # "local" or "s3"
  s3:
    endpoint: "https://s3.ap-northeast-1.amazonaws.com" # Or Cloudflare R2
    region: "ap-northeast-1"
    bucket: "gitina-repos"
    prefix: "repos/" # S3 prefix for repository bundles
    access_key_id: "YOUR_ACCESS_KEY"
    secret_access_key: "YOUR_SECRET_KEY"
    use_path_style: false
  cache:
    max_size_gb: 15 # Maximum local SSD cache size in GB before LRU eviction

# Git LFS Configuration
lfs:
  storage: "local" # Choose: "local" or "s3"
  local:
    path: "./data/lfs"
  s3:
    endpoint: "https://s3.ap-northeast-1.amazonaws.com" # Or Cloudflare R2: https://<account_id>.r2.cloudflarestorage.com
    region: "ap-northeast-1"
    bucket: "gitina-lfs"
    access_key_id: "YOUR_ACCESS_KEY"
    secret_access_key: "YOUR_SECRET_KEY"
    use_path_style: false

# GitHub OAuth Application Configuration
github:
  client_id: "Iv1.xxxxxxxxxxxx"
  client_secret: "xxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Administrators (GitHub Usernames)
# Admins have full read-write access to ALL repositories.
admins:
  - "hinanoaira"

# Repository Access Control (ACL)
# Repositories are matched by exact path or wildcard glob (e.g. *, **).
repositories:
  # Public repository: Anyone can clone/fetch anonymously.
  # Only authorized collaborators or admins can push.
  - path: "open-source/*"
    public: true
    collaborators:
      alice: "rw"

  # Deeply nested private repository
  - path: "path/to/directory.git"
    public: false
    collaborators:
      alice: "rw"
      bob: "ro"

  # Single private repository
  - path: "fuga.git"
    public: false
    collaborators:
      charlie: "rw"
